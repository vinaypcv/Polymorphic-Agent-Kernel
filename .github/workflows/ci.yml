name: pak-core CI Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Native Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev libsnappy-dev build-essential clang

      - name: Install Native Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install rocksdb snappy

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pydantic pytest trio z3-solver

      - name: Build and Install Wheel via Maturin
        run: |
          maturin build --release --out target/wheels
          python -m pip install --force-reinstall target/wheels/*.whl

      - name: Run E2E Integration Suite (20 Test Cases)
        run: python -m pytest -v tests/