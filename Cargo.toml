[package]
name = "pak_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "pak_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rocksdb = { version = "0.21.0", features = ["snappy"] }